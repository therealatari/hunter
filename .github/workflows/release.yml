name: release

# A tag like v0.5.1 builds the single-file eohunter.lic and attaches it
# (with its line map) to a GitHub release of the same name. Distribution
# from there, to the scripts repo or a jinx manifest, is a separate step.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rake build
      - run: ruby -c dist/eohunter.lic
      - run: ruby -c dist/libeocoordination.lic
      - run: ruby -c dist/eohunter-setup.lic
      - run: ruby -c dist/libeohuntergroup.lic
      - run: ruby -c dist/eohunter-ma-group.lic
      - name: Check the tag matches the engine version
        run: |
          version=$(ruby -e "puts File.read('scripts/eohunter/engine.rb')[/VERSION = '([^']+)'/, 1]")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but engine VERSION is $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eohunter.lic
            dist/eohunter.lic.map
            dist/libeocoordination.lic
            dist/libeocoordination.lic.map
            dist/eohunter-setup.lic
            dist/eohunter-setup.lic.map
            dist/eohunter-ma-group.lic
            dist/libeohuntergroup.lic
            dist/libeohuntergroup.lic.map
          generate_release_notes: true
